services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      PORT: "8080"
      DATA_DIR: /data
      DEFAULT_SCREENSHOT_INTERVAL: "${DEFAULT_SCREENSHOT_INTERVAL:-60}"
      MAX_FRAMES: "${MAX_FRAMES:-120}"
      TZ: "${TZ:-Asia/Shanghai}"
    volumes:
      - ./data:/data
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8088:80"
